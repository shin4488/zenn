<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 800 340" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- パネル区切り -->
  <line x1="400" y1="20" x2="400" y2="320" stroke="#D1D5DB" stroke-width="2"/>

  <!-- ===================== 左:集中している例 ===================== -->
  <text x="210" y="36" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">同じワーカー・同じ時間帯に集中</text>

  <!-- 表(ゾンビ検出ログの一覧) -->
  <rect x="40" y="60" width="340" height="24" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="40" y="84" width="340" height="90" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="110" y1="60" x2="110" y2="174" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="190" y1="60" x2="190" y2="174" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="40" y1="114" x2="380" y2="114" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="40" y1="144" x2="380" y2="144" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-size="12" fill="#6B7280" text-anchor="middle" font-weight="bold">
    <text x="75" y="77">時刻</text>
    <text x="150" y="77">DAG</text>
    <text x="285" y="77">Hostname</text>
  </g>
  <!-- そろっているセルを強調 -->
  <g fill="#FEE2E2">
    <rect x="41" y="85" width="69" height="29"/><rect x="41" y="115" width="69" height="29"/><rect x="41" y="145" width="69" height="28"/>
    <rect x="191" y="85" width="188" height="29"/><rect x="191" y="115" width="188" height="29"/><rect x="191" y="145" width="188" height="28"/>
  </g>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <text x="75" y="104" fill="#B91C1C" font-weight="bold">10:05</text>
    <text x="150" y="104">👻 DAG A</text>
    <text x="285" y="104" fill="#B91C1C" font-weight="bold">worker-1</text>
    <text x="75" y="134" fill="#B91C1C" font-weight="bold">10:05</text>
    <text x="150" y="134">👻 DAG B</text>
    <text x="285" y="134" fill="#B91C1C" font-weight="bold">worker-1</text>
    <text x="75" y="164" fill="#B91C1C" font-weight="bold">10:06</text>
    <text x="150" y="164">👻 DAG C</text>
    <text x="285" y="164" fill="#B91C1C" font-weight="bold">worker-1</text>
  </g>
  <text x="210" y="196" font-size="12" fill="#B91C1C" text-anchor="middle">時刻も Hostname もそろっている</text>

  <line x1="210" y1="206" x2="210" y2="228" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="50" y="234" width="320" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="210" y="260" font-size="13" fill="#DC2626" text-anchor="middle" font-weight="bold">疑うもの：このワーカー自体の問題</text>
  <text x="210" y="282" font-size="12" fill="#DC2626" text-anchor="middle">再起動・メモリやCPUの不足など</text>

  <!-- ===================== 右:ばらばらの例 ===================== -->
  <text x="595" y="36" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="bold">ワーカーも時間帯もばらばら</text>

  <rect x="425" y="60" width="340" height="24" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="425" y="84" width="340" height="90" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="495" y1="60" x2="495" y2="174" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="575" y1="60" x2="575" y2="174" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="425" y1="114" x2="765" y2="114" stroke="#E5E7EB" stroke-width="1.5"/>
  <line x1="425" y1="144" x2="765" y2="144" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-size="12" fill="#6B7280" text-anchor="middle" font-weight="bold">
    <text x="460" y="77">時刻</text>
    <text x="535" y="77">DAG</text>
    <text x="670" y="77">Hostname</text>
  </g>
  <!-- ワーカーごとに色が違う -->
  <rect x="576" y="85" width="188" height="29" fill="#DBEAFE"/>
  <rect x="576" y="115" width="188" height="29" fill="#EDE9FE"/>
  <rect x="576" y="145" width="188" height="28" fill="#CCFBF1"/>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <text x="460" y="104">09:10</text>
    <text x="535" y="104">👻 DAG A</text>
    <text x="670" y="104" fill="#1D4ED8" font-weight="bold">worker-1</text>
    <text x="460" y="134">11:40</text>
    <text x="535" y="134">👻 DAG B</text>
    <text x="670" y="134" fill="#6D28D9" font-weight="bold">worker-3</text>
    <text x="460" y="164">15:25</text>
    <text x="535" y="164">👻 DAG C</text>
    <text x="670" y="164" fill="#0F766E" font-weight="bold">worker-2</text>
  </g>
  <text x="595" y="196" font-size="12" fill="#6B7280" text-anchor="middle">時刻も Hostname もそろっていない</text>

  <line x1="595" y1="206" x2="595" y2="228" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="435" y="234" width="320" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="595" y="260" font-size="13" fill="#1D4ED8" text-anchor="middle" font-weight="bold">疑うもの：タスク固有の問題、または</text>
  <text x="595" y="282" font-size="12" fill="#1D4ED8" text-anchor="middle">DB・ネットワークなど環境全体の問題</text>
</svg>
