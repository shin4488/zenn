<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="660" viewBox="0 0 760 330" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- 調査対象の時間帯 -->
  <rect x="410" y="60" width="180" height="235" fill="#FEF9C3"/>
  <text x="500" y="318" font-size="13" fill="#A16207" text-anchor="middle">前後10〜15分</text>

  <!-- 行の基準線 -->
  <g stroke="#E5E7EB" stroke-width="1.5">
    <line x1="130" y1="100" x2="730" y2="100"/>
    <line x1="130" y1="155" x2="730" y2="155"/>
    <line x1="130" y1="210" x2="730" y2="210"/>
    <line x1="130" y1="265" x2="730" y2="265"/>
  </g>

  <!-- 行ラベル -->
  <text x="20" y="104" font-size="13" fill="#1F2937">ワーカー再起動</text>
  <text x="20" y="159" font-size="13" fill="#1F2937">メモリ使用率</text>
  <text x="20" y="214" font-size="13" fill="#1F2937">DBの正常性</text>
  <text x="20" y="269" font-size="13" fill="#1F2937">環境の変更</text>

  <!-- ワーカー再起動:検出直前に1回 -->
  <polygon points="462,102 480,102 471,80" fill="#DC2626"/>

  <!-- メモリ使用率:検出直前に上限へ近づく -->
  <line x1="130" y1="128" x2="730" y2="128" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="735" y="132" font-size="11" fill="#6B7280">80%</text>
  <polyline points="130,150 230,149 320,146 380,142 420,136 445,128 460,119 470,114 478,117 486,122 494,135 505,146 530,150 730,150" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- DBの正常性:期間中ずっと正常 -->
  <line x1="130" y1="205" x2="730" y2="205" stroke="#16A34A" stroke-width="2"/>
  <g fill="#16A34A">
    <circle cx="150" cy="205" r="3"/><circle cx="190" cy="205" r="3"/><circle cx="230" cy="205" r="3"/>
    <circle cx="270" cy="205" r="3"/><circle cx="310" cy="205" r="3"/><circle cx="350" cy="205" r="3"/>
    <circle cx="390" cy="205" r="3"/><circle cx="430" cy="205" r="3"/><circle cx="470" cy="205" r="3"/>
    <circle cx="510" cy="205" r="3"/><circle cx="550" cy="205" r="3"/><circle cx="590" cy="205" r="3"/>
    <circle cx="630" cy="205" r="3"/><circle cx="670" cy="205" r="3"/><circle cx="710" cy="205" r="3"/>
  </g>

  <!-- 環境の変更:時間帯の外 -->
  <polygon points="230,248 243,260 230,272 217,260" fill="#2563EB"/>

  <!-- 検出時刻 -->
  <line x1="500" y1="46" x2="500" y2="296" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="36" font-size="14" fill="#DC2626" text-anchor="middle" font-weight="bold">ゾンビ検出</text>

  <!-- 時間軸 -->
  <line x1="130" y1="295" x2="738" y2="295" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowG)"/>
</svg>
